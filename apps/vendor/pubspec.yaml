name: happfest_fornecedor
description: "HappFest — app do fornecedor."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  firebase_analytics: ^12.4.6
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  happfest_core:
    path: ../../packages/core
  happfest_design_system:
    path: ../../packages/design_system

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.1
  freezed: ^3.2.5
  go_router_builder: ^4.4.0
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
        - asset: assets/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
